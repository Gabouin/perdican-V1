# openocd.cfg — PERDICAN V1 over the 4-pin DEBUG header.
#
# DEBUG header:  1 = +3V3   2 = SWDIO (PA13)   3 = SWCLK (PA14)   4 = GND
#
# The header has no NRST pin, so OpenOCD must reset the core over SWD rather
# than by toggling a reset line. `connect_assert_srst` is deliberately not
# used for that reason; if you need a hard reset, press the RESET button.
#
#   openocd -f tools/openocd.cfg
#   openocd -f tools/openocd.cfg -c "program build/perdican.elf verify reset exit"

source [find interface/stlink.cfg]

transport select swd

source [find target/stm32g4x.cfg]

# 128 KB single-bank flash on the STM32G431CBT6.
reset_config srst_nogate

$_CHIPNAME.cpu configure -event reset-init {
    # Nothing board-specific to do: the firmware configures its own clocks.
}
